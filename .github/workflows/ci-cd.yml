name: Circus App CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'  # Ежедневно в 2:00

env:
  PYTHON_VERSION: '3.11'
  FLASK_ENV: 'test'

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Run unit tests
      run: |
        python -m pytest tests/test_unit.py -v --cov=app --cov=models --cov-report=term-missing
    
    - name: Run integration tests
      run: |
        python -m pytest tests/test_integration.py -v --cov=app --cov-append
    
    - name: Run system tests
      run: |
        python -m pytest tests/test_system.py::TestCircusSystem -v --cov=app --cov-append
    
    - name: Run all tests with coverage report
      run: |
        python -m pytest tests/ -v --cov=app --cov=models --cov-report=xml --cov-report=html
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: true
    
    - name: Test Docker build
      run: |
        docker build -t circus-app .

  security:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Run security checks
      run: |
        pip install bandit safety
        bandit -r app.py models.py
        safety check -r requirements.txt
    
    - name: Check for secrets
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install linting tools
      run: |
        pip install flake8 black pylint
    
    - name: Check code style with black
      run: |
        black --check app.py models.py tests/
    
    - name: Lint with flake8
      run: |
        flake8 app.py models.py tests/
    
    - name: Lint with pylint
      run: |
        pylint app.py models.py || true  # Continue even with warnings

  deploy:
    runs-on: ubuntu-latest
    needs: [test, security, lint]
    
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/circus-app:latest
          ${{ secrets.DOCKER_USERNAME }}/circus-app:${{ github.sha }}
    
    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # Здесь можно добавить деплой на Heroku, AWS, etc.
        # Например:
        # curl -X POST ${{ secrets.DEPLOY_WEBHOOK }}
    
    - name: Notify success
      if: success()
      run: |
        echo "✅ Deployment successful!"
        # Можно добавить уведомление в Slack/Telegram

  health-check:
    runs-on: ubuntu-latest
    needs: deploy
    
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Wait for deployment
      run: sleep 30
    
    - name: Health check
      run: |
        # Здесь можно добавить проверку работоспособности после деплоя
        echo "Performing health check..."
        # Например:
        # curl -f ${{ secrets.STAGING_URL }}/api/stats || exit 1
    
    - name: Run smoke tests
      run: |
        echo "Running smoke tests..."
        # Простые тесты после деплоя

  cleanup:
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Cleanup
      run: |
        echo "Cleaning up..."
        docker system prune -f